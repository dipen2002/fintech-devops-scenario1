{% extends "base.html" %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="card" style="padding: 48px 24px;">
        <div style="font-size: 4rem; font-weight: 800; color: var(--accent-danger); margin-bottom: 8px;" class="font-mono">500</div>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 12px;">Internal Server Error</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem;">
            An unexpected error occurred during request processing. An incident has been recorded in the application logs.
        </p>
        <div style="display: flex; justify-content: center; gap: 12px;">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
            <a href="{{ url_for('main.health') }}" class="btn btn-secondary">Check System Health</a>
        </div>
    </div>
</div>
{% endblock %}
