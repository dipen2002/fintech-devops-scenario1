# ==============================================================================
# FinTechFlow - Continuous Integration (CI) Pipeline
# ==============================================================================
# Purpose:
#   Automates quality gates, linting, unit/integration testing, coverage,
#   security scanning (SAST + SCA), and container build verification.
#
# Triggers:
#   - Pushes to 'main' branch
#   - Pull requests targeting 'main' branch
# ==============================================================================

name: FinTechFlow CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Continuous Integration & Quality Gates
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # STAGE 1: CHECKOUT SOURCE CODE
      # ------------------------------------------------------------------------
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # STAGE 2: SET UP PYTHON RUNTIME
      # ------------------------------------------------------------------------
      - name: "Stage 2: Set Up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------------------
      # STAGE 3: INSTALL DEPENDENCIES
      # ------------------------------------------------------------------------
      - name: "Stage 3: Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ------------------------------------------------------------------------
      # STAGE 4: CODE QUALITY & LINTING (RUFF)
      # ------------------------------------------------------------------------
      - name: "Stage 4: Lint with Ruff"
        run: |
          ruff check .

      # ------------------------------------------------------------------------
      # STAGE 5: AUTOMATED UNIT & INTEGRATION TESTS (PYTEST)
      # ------------------------------------------------------------------------
      - name: "Stage 5: Run Pytest Suite"
        run: |
          pytest -q

      # ------------------------------------------------------------------------
      # STAGE 6: CODE COVERAGE ANALYSIS
      # ------------------------------------------------------------------------
      - name: "Stage 6: Code Coverage Verification"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      # ------------------------------------------------------------------------
      # STAGE 7: STATIC APPLICATION SECURITY TESTING - SAST (BANDIT)
      # ------------------------------------------------------------------------
      - name: "Stage 7: Bandit Security Scan"
        run: |
          bandit -r app

      # ------------------------------------------------------------------------
      # STAGE 8: SOFTWARE COMPOSITION ANALYSIS - SCA (PIP-AUDIT)
      # ------------------------------------------------------------------------
      - name: "Stage 8: Dependency Vulnerability Audit (pip-audit)"
        run: |
          pip-audit

      # ------------------------------------------------------------------------
      # STAGE 9: DOCKER CONTAINER BUILD VERIFICATION
      # ------------------------------------------------------------------------
      - name: "Stage 9: Build Docker Image"
        run: |
          docker build -t fintechflow:${{ github.sha }} -t fintechflow:latest .

      # ------------------------------------------------------------------------
      # STAGE 10: PIPELINE SUMMARY & QUALITY GATE RESULT
      # ------------------------------------------------------------------------
      - name: "Stage 10: CI Quality Gate Result"
        if: success()
        run: |
          echo "======================================================="
          echo " FinTechFlow CI Pipeline Passed Successfully!         "
          echo " All 10 Stages Validated: Ready for Staging Deployment "
          echo "======================================================="
