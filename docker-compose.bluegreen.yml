# ==============================================================================
# FinTechFlow - Blue-Green Deployment Simulation (Docker Compose)
# ==============================================================================
# Educational Demonstration:
#   Simulates two concurrent isolated deployment slots:
#   - Blue (Active Production Slot): Port 5001 (Version 1.0.0)
#   - Green (Release Candidate Slot): Port 5002 (Version 1.1.0)
#
# Workflow:
#   1. Start both environments:
#        docker compose -f docker-compose.bluegreen.yml up --build -d
#   2. Validate Green health check:
#        curl http://localhost:5002/health
#   3. If healthy, switch routing (or promote Green to main port).
#   4. If failure detected, traffic remains on Blue (5001) with zero downtime.
# ==============================================================================

services:
  # BLUE ENVIRONMENT (Current Production Baseline)
  blue-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintechflow-blue
    image: fintechflow:1.0.0
    ports:
      - "5001:5000"
    environment:
      - ENVIRONMENT=production
      - APP_NAME=FinTechFlow [BLUE]
      - APP_VERSION=1.0.0
      - PORT=5000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  # GREEN ENVIRONMENT (New Release Candidate)
  green-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintechflow-green
    image: fintechflow:1.1.0
    ports:
      - "5002:5000"
    environment:
      - ENVIRONMENT=staging
      - APP_NAME=FinTechFlow [GREEN]
      - APP_VERSION=1.1.0
      - PORT=5000
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
